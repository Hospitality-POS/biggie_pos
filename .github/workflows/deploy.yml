name: Build

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 138.197.29.241 >> ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean droplet (atomic release)
        env:
          APP_ROOT: /var/www/biggie_pos
          RELEASE: ${{ github.sha }}
        run: |
          RELEASE_DIR="$APP_ROOT/releases/$RELEASE"

          # Upload the new build into its own, isolated release directory.
          # Nothing under $APP_ROOT/current is touched while this runs, so
          # in-flight requests keep being served the old (fully intact) build.
          ssh root@138.197.29.241 "mkdir -p '$RELEASE_DIR'"
          scp -r dist/. root@138.197.29.241:"$RELEASE_DIR"/

          # Flip the "current" symlink to the new release in a single atomic
          # rename, then prune old releases. Nginx should serve from
          # $APP_ROOT/current (a symlink), not from $APP_ROOT directly.
          ssh root@138.197.29.241 bash -s <<EOF
            set -euo pipefail
            ln -sfn "$RELEASE_DIR" "$APP_ROOT/current_tmp"
            mv -Tf "$APP_ROOT/current_tmp" "$APP_ROOT/current"
            cd "$APP_ROOT/releases"
            ls -1dt */ | tail -n +6 | xargs -r rm -rf
          EOF
