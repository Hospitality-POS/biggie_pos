name: Notify desktop app

# Triggers a new Base desktop release in Hospitality-POS/base_desktop whenever
# master is updated. Add `[skip desktop]` to a commit message to skip.
on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip desktop]')"
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BASE_DESKTOP_PAT }}
          repository: Hospitality-POS/base_desktop
          event-type: biggie-pos-updated
